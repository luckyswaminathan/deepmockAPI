version: "3.9"

services:
  redis:
    image: redis:7
    container_name: deepmock-redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 1gb
      --maxmemory-policy allkeys-lfu
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: deepmock-backend
    depends_on:
      - redis
    environment:
      # Store database in /tmp (not mounted from host) for ephemeral storage
      _DATABASE_URL: sqlite:////tmp/deepmock.db
      DATABASE_URL: sqlite:////tmp/deepmock.db
      REDIS_URL: redis://redis:6379/0
      RL_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
      --reload
