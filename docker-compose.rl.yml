version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: deepmock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepmock
      POSTGRES_PASSWORD: deepmock
      POSTGRES_DB: deepmock
    ports:
      - "5432:5432"
    volumes:
      - deepmock_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: deepmock-redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 1gb
      --maxmemory-policy allkeys-lfu
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: deepmock-backend
    depends_on:
      - postgres
      - redis
    environment:
      _DATABASE_URL: postgresql+psycopg://deepmock:deepmock@postgres:5432/deepmock
      DATABASE_URL: postgresql+psycopg://deepmock:deepmock@postgres:5432/deepmock
      REDIS_URL: redis://redis:6379/0
      RL_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  deepmock_pg:
