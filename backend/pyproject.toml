[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uvicorn>=0.38.0",
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.21",
    "psycopg[binary]>=3.1.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.5",
    "gymnasium>=0.29.1",
]

[project.scripts]
deepmock-run-generated-tests = "generated_apis.cli:main"
reverse-generate = "reverse.cli:main"

[tool.setuptools.packages.find]
include = ["backend", "reverse", "generated_apis"]
